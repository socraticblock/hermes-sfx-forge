[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sfx-forge"
version = "1.0.0"
description = "Deterministic, sample-free game SFX synthesis with a delivery gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Socraticblock" }]
# Oldest API-compatible floors with upper bounds: nothing here should silently
# adopt a new major release the Hermes core constraints do not allow.
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sfx-forge = "sfx_forge.cli:main"

[tool.setuptools]
packages = ["sfx_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
norecursedirs = [".venv", ".git", "build", "dist"]
