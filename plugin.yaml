name: hermes-sfx-forge
version: "1.0.0"
description: >
  Deterministic, sample-free game sound effects: two tools that render short
  one-shot WAV cues from named presets with an explicit seed, then verify each
  file against a fixed delivery gate (exact sample count, sample and
  inter-sample peak ceilings, DC offset, clipping, edge silence) and return a
  manifest with per-cue measurements and sha256 hashes. Synthesis uses NumPy and SciPy:
  no samples, no model, no network, no subprocess. Output location is a workspace
  name within a configured root; the CLI additionally allows an operator-supplied
  --root path for explicit local workflows.
author: Socraticblock
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - sfx_generate
  - sfx_verify
provides_hooks: []
# Must be a list of capability ids (Hermes rejects a mapping here at load time and
# logs a warning). This plugin requests none: it registers tools, nothing privileged.
capabilities: []

